<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Free Training: Do Your First House Flip</title>
    <meta name="description" content="Enter your info to watch the free training." />
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; }
      .hero { padding: 24px; }
      .hidden-legal { display: none; }
      .tall { height: 520px; }
    </style>
  </head>
  <body>
    <div class="hero">
      <h1>Learn How to Flip Your First House Even If You Have No Money</h1>
      <h4>Enter Your Info to Watch the Free 10-Minute Training</h4>

      <!-- The form's fields are above the fold; its submit lands just below. -->
      <h2>CONTACT INFORMATION</h2>
      <label for="first_name">First Name</label>
      <input id="first_name" name="first_name" type="text" />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" />
      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" />
      <div class="tall"></div>
      <button id="go" type="submit">SUBMIT</button>
    </div>

    <!-- A hidden legal block with its own H1: must not drive heading findings. -->
    <div class="hidden-legal">
      <h1>Legal notice</h1>
      <h3>Terms</h3>
    </div>

    <footer>
      <p>&copy; RealSide Real Estate, 2026</p>
    </footer>

    <script>
      // Stands in for a third-party security widget failing noisily.
      setTimeout(function () {
        const img = new Image();
        img.src = "https://challenges.cloudflare.com/cdn-cgi/challenge-platform/does-not-exist";
      }, 10);
    </script>
  </body>
</html>
